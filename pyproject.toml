[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "woyou"
version = "0.4.0"
description = "卧游 Woyou — 一个本地运行、无需代理的个人地理探索台"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Woyou" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
woyou = "woyou.__main__:main"

[tool.setuptools.packages.find]
include = ["woyou*"]

[tool.setuptools.package-data]
woyou = [
    "templates/*.html",
    "templates/panels/*.html",
    "static/*.js",
    "static/*.css",
    "static/css/*.css",
    "static/js/*.js",
    "static/vendor/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
